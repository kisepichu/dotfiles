set -g @layout_pc 'd9d8,76x43,0,0[76x21,0,0{38x21,0,0,0,37x21,39,0,3},76x21,0,22{38x21,0,22,1,37x21,39,22[37x10,39,22,2,37x10,39,33,4]}]'

set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'
set -as terminal-features ',xterm-256color:RGB,screen-256color:RGB:clipboard'
set-option -s set-clipboard on
# yazi image previews: let panes pass inline-image sequences to the outer
# terminal, and keep the outer TERM / TERM_PROGRAM so yazi picks the protocol.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
# omp inline images: on WezTerm omp sends Kitty images through the passthrough
# above, but tmux forwards them at its own cursor, so they land at the top-left
# and stay (can1357/oh-my-pi#19396). SIXEL is drawn by tmux itself instead.
# macOS only: Homebrew's tmux renders SIXEL; WSL / NixOS tmux are unverified.
# Drop this once omp picks SIXEL inside tmux on its own (the fix for #19396).
if-shell 'test "$(uname)" = Darwin' 'set-environment -g PI_FORCE_IMAGE_PROTOCOL sixel'

set -g prefix C-f
unbind C-b

set-option -g status-position top
set-option -g status-left-length 90
set-option -g status-right-length 120
set-option -g status-left '#H:[#P]'
# @sv: the next task shown by supervisor (sv daemon); empty when it is not running.
set-option -g status-right '#{?@sv,#{@sv} ,}[%Y-%m-%d(%a) %H:%M]'
set-option -g status-interval 1
set-option -g status-justify centre
set-option -g status-bg "colour238"
set-option -g status-fg "colour255"

bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

unbind C-Left
unbind C-Right
unbind C-Up
unbind C-Down
unbind Left
unbind Right
unbind Up
unbind Down
unbind M-b
unbind M-f

bind -r C-Left swap-pane -d -s :. -t '{left-of}'
bind -r C-Right swap-pane -d -s :. -t '{right-of}'
bind -r C-Up swap-pane -d -s :. -t '{up-of}'
bind -r C-Down swap-pane -d -s :. -t '{down-of}'

bind | split-window -h
bind - split-window -v

set-option -g base-index 1
set-option -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind-key -n WheelDownPane select-pane -t= \; send-keys -M

setw -g mode-keys vi
# Copy only into the tmux buffer; `set-clipboard on` forwards it to the outer
# terminal's clipboard via OSC 52 (UTF-8 safe, also works over SSH). Do not
# pipe to clip.exe: it decodes stdin with the Windows ANSI code page and
# garbles non-ASCII text. Enter / MouseDragEnd1Pane restate tmux's defaults so
# a config reload also replaces bindings left by older plugins (tmux-yank).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-line-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Vim-like text objects (viw, viW, vi", va(, ...). tmux has none natively, so
# `i` / `a` enter a one-shot key table that rebuilds the selection with cursor
# motions. Quotes / brackets are searched on the current line only and nesting
# is not tracked.
bind -T copy-mode-vi i switch-client -T copy-mode-vi-inner
bind -T copy-mode-vi a switch-client -T copy-mode-vi-around
bind -T copy-mode-vi-inner w send -X clear-selection \; send -X select-word
bind -T copy-mode-vi-around w send -X clear-selection \; send -X select-word \; send -X cursor-right
bind -T copy-mode-vi-inner W send -X clear-selection \; send -X cursor-right \; send -X previous-space \; send -X begin-selection \; send -X next-space-end
bind -T copy-mode-vi-around W send -X clear-selection \; send -X cursor-right \; send -X previous-space \; send -X begin-selection \; send -X next-space-end \; send -X cursor-right
bind -T copy-mode-vi-inner '"' send -X clear-selection \; send -X jump-to-backward '"' \; send -X begin-selection \; send -X jump-to-forward '"'
bind -T copy-mode-vi-around '"' send -X clear-selection \; send -X jump-backward '"' \; send -X begin-selection \; send -X jump-forward '"'
bind -T copy-mode-vi-inner "'" send -X clear-selection \; send -X jump-to-backward "'" \; send -X begin-selection \; send -X jump-to-forward "'"
bind -T copy-mode-vi-around "'" send -X clear-selection \; send -X jump-backward "'" \; send -X begin-selection \; send -X jump-forward "'"
bind -T copy-mode-vi-inner '`' send -X clear-selection \; send -X jump-to-backward '`' \; send -X begin-selection \; send -X jump-to-forward '`'
bind -T copy-mode-vi-around '`' send -X clear-selection \; send -X jump-backward '`' \; send -X begin-selection \; send -X jump-forward '`'
bind -T copy-mode-vi-inner ( send -X clear-selection \; send -X jump-to-backward ( \; send -X begin-selection \; send -X jump-to-forward )
bind -T copy-mode-vi-around ( send -X clear-selection \; send -X jump-backward ( \; send -X begin-selection \; send -X jump-forward )
bind -T copy-mode-vi-inner ) send -X clear-selection \; send -X jump-to-backward ( \; send -X begin-selection \; send -X jump-to-forward )
bind -T copy-mode-vi-around ) send -X clear-selection \; send -X jump-backward ( \; send -X begin-selection \; send -X jump-forward )
bind -T copy-mode-vi-inner b send -X clear-selection \; send -X jump-to-backward ( \; send -X begin-selection \; send -X jump-to-forward )
bind -T copy-mode-vi-around b send -X clear-selection \; send -X jump-backward ( \; send -X begin-selection \; send -X jump-forward )
bind -T copy-mode-vi-inner [ send -X clear-selection \; send -X jump-to-backward [ \; send -X begin-selection \; send -X jump-to-forward ]
bind -T copy-mode-vi-around [ send -X clear-selection \; send -X jump-backward [ \; send -X begin-selection \; send -X jump-forward ]
bind -T copy-mode-vi-inner ] send -X clear-selection \; send -X jump-to-backward [ \; send -X begin-selection \; send -X jump-to-forward ]
bind -T copy-mode-vi-around ] send -X clear-selection \; send -X jump-backward [ \; send -X begin-selection \; send -X jump-forward ]
bind -T copy-mode-vi-inner '{' send -X clear-selection \; send -X jump-to-backward '{' \; send -X begin-selection \; send -X jump-to-forward '}'
bind -T copy-mode-vi-around '{' send -X clear-selection \; send -X jump-backward '{' \; send -X begin-selection \; send -X jump-forward '}'
bind -T copy-mode-vi-inner '}' send -X clear-selection \; send -X jump-to-backward '{' \; send -X begin-selection \; send -X jump-to-forward '}'
bind -T copy-mode-vi-around '}' send -X clear-selection \; send -X jump-backward '{' \; send -X begin-selection \; send -X jump-forward '}'
bind -T copy-mode-vi-inner B send -X clear-selection \; send -X jump-to-backward '{' \; send -X begin-selection \; send -X jump-to-forward '}'
bind -T copy-mode-vi-around B send -X clear-selection \; send -X jump-backward '{' \; send -X begin-selection \; send -X jump-forward '}'
bind -T copy-mode-vi-inner < send -X clear-selection \; send -X jump-to-backward < \; send -X begin-selection \; send -X jump-to-forward >
bind -T copy-mode-vi-around < send -X clear-selection \; send -X jump-backward < \; send -X begin-selection \; send -X jump-forward >
bind -T copy-mode-vi-inner > send -X clear-selection \; send -X jump-to-backward < \; send -X begin-selection \; send -X jump-to-forward >
bind -T copy-mode-vi-around > send -X clear-selection \; send -X jump-backward < \; send -X begin-selection \; send -X jump-forward >

bind-key C-n new-window -n copy "tmux capture-pane -t ! -pS -32768 | nvim -; tmux kill-window"
bind-key C-p display-popup -E "fish"
# prefix + S: reopen the supervisor menu (candidates are in @sv_a/b/c). ~/.local/bin/sv is
# supervisor's bin/sv where the daemon runs, and bin/sv-inbox on hosts it watches over ssh.
# run-shell -b with output discarded, otherwise the output opens in view mode over the pane.
bind S display-menu -T sv -x R -y S \
	"#{?@sv_a,#{@sv_a},-(no candidates)}" a "run-shell -b '~/.local/bin/sv a >/dev/null 2>&1'" \
	"#{?@sv_b,#{@sv_b},-}" b "run-shell -b '~/.local/bin/sv b >/dev/null 2>&1'" \
	"#{?@sv_c,#{@sv_c},-}" c "run-shell -b '~/.local/bin/sv c >/dev/null 2>&1'" \
	"(write my own)" w "command-prompt -p 'task:' \"set -g @sv_want \\\"%%%\\\" ; run-shell -b \\\"~/.local/bin/sv want ##{q:@sv_want} >/dev/null 2>&1\\\"\""

set -g focus-events on
set-hook -g pane-focus-in 'run-shell -b "zoom=\$(tmux display-message -p \"#{window_zoomed_flag}\"); [ \"\$zoom\" = 0 ] || exit 0; no=\$(tmux show-option -pqv @no_auto_zoom); [ -z \"\$no\" ] || exit 0; tty=\$(tmux display-message -p \"#{pane_tty}\"); cmd=\$(ps -o comm= -t \${tty#/dev/} 2>/dev/null | tail -n 1); cmd=\$(basename \"\$cmd\"); case \"\$cmd\" in nvim|vim) tmux resize-pane -Z ;; esac"'

unbind !
bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s $.0

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-capture-pane-contents 'on'
# resurrect は復元直後に pane_contents を削除するが、fish は -c でも config.fish を読むため
# cat が間に合わず内容が復元されない (tmux-resurrect #328)。削除を次回復元の直前まで遅らせる。
set -g @resurrect-hook-pre-restore-all '(dir="$(pane_contents_dir restore)"; [ -d "$dir" ] && rm -f -- "$dir"pane-*); cleanup_restored_pane_contents() { :; }'

if-shell 'test -x ~/.tmux/plugins/tpm/tpm' 'run ~/.tmux/plugins/tpm/tpm'
