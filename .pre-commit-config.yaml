repos:
  - repo: local
    hooks:
      - id: chezmoi-managed
        name: chezmoi managed paths are intentional
        entry: scripts/check-chezmoi-managed.sh
        language: system
        pass_filenames: false
      - id: codex-skills
        name: validate Codex/Claude skill metadata
        entry: scripts/validate-skills.sh
        language: system
        pass_filenames: false
      - id: public-safety
        name: public dotfiles safety scan
        entry: scripts/check-public-safety.sh
        language: system
        pass_filenames: false
      - id: cloudflared-ssh-proxy
        name: test cloudflared SSH proxy
        entry: scripts/test-cloudflared-access-ssh-proxy.sh
        language: system
        pass_filenames: false
      - id: mise-config
        name: validate mise tool backends
        entry: scripts/test-mise-config.sh
        language: system
        pass_filenames: false
      - id: bootstrap-nixos
        name: test NixOS bootstrap defaults
        entry: scripts/test-bootstrap-nixos.sh
        language: system
        pass_filenames: false
      - id: agent-cli-install
        name: test agent CLI install script
        entry: scripts/test-agent-cli-install.sh
        language: system
        pass_filenames: false
      - id: secretlint
        name: secretlint
        entry: secretlint
        language: node
        types_or: [text]
        # Files only. At commit-msg, secretlint skips .git/COMMIT_EDITMSG in a
        # normal checkout (it ignores **/.git/**) and crashes in a linked
        # worktree, where the message path starts with ../ outside the cwd.
        stages: [pre-commit]
        additional_dependencies:
          - secretlint@11.4.1
          - "@secretlint/secretlint-rule-preset-recommend@11.4.1"
      - id: newline-eof
        name: require newline at EOF
        entry: scripts/check-newline-eof.sh
        language: system
        pass_filenames: false
      - id: git-diff-check
        name: reject whitespace errors in staged diff
        entry: scripts/check-git-diff.sh
        language: system
        pass_filenames: false
      - id: tmux-terminal-capabilities
        name: tmux terminal capabilities
        entry: scripts/test-tmux-terminal.sh
        language: system
        files: ^(dot_tmux\.conf|scripts/test-tmux-terminal\.sh)$
        pass_filenames: false
      - id: tmux-copy-mode
        name: tmux copy mode (UTF-8 yank via OSC 52, text objects)
        entry: scripts/test-tmux-copy-mode.sh
        language: system
        files: ^(dot_tmux\.conf|scripts/test-tmux-copy-mode\.sh)$
        pass_filenames: false
      - id: glazewm-window-picker
        name: GlazeWM window picker helpers (Windows host AutoHotkey)
        entry: scripts/test-glazewm-window-picker.sh
        language: system
        files: ^(dot_glzr/glazewm/window-picker-lib\.ahk|scripts/test-glazewm-window-picker\.(sh|ahk))$
        pass_filenames: false
      - id: windows-wezterm-ssh
        name: WezTerm SSH setup for WSL (ssh config block, key, known_hosts)
        entry: scripts/test-windows-wezterm-ssh.sh
        language: system
        files: ^(run_onchange_after_37-setup-windows-wezterm-ssh\.sh\.tmpl|scripts/test-windows-wezterm-ssh\.sh)$
        pass_filenames: false
